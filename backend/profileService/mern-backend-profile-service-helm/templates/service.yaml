apiVersion: v1
kind: Service
metadata:
  namespace: mern-app
  name: {{ include "mern-backend-profile-service-helm.fullname" . }}
  labels:
    {{- include "mern-backend-profile-service-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "mern-backend-profile-service-helm.selectorLabels" . | nindent 4 }}
